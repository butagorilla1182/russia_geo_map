<html><head><meta charset="utf-8"><title>Russia GEO Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:sans-serif}.bar{padding:12px;background:#f7f3ea}#map{height:78vh;width:100vw}</style></head><body>
<div class="bar"><b>Russia GEO Map</b><br>CelesTrak GEO TLEから抽出したRussia GEOの地図表示<br>表示衛星数：25 機</div>
<div id="map"></div>
<script>
const data = [{"name": "YAMAL 300K", "norad": "38978", "lat": "-0.0245", "lon": "-177.0609", "alt_km": "35786.6"}, {"name": "LUCH-5B", "norad": "38977", "lat": "10.5907", "lon": "-16.3573", "alt_km": "35775.4"}, {"name": "ELEKTRO-L 2", "norad": "41105", "lat": "6.4568", "lon": "-14.5986", "alt_km": "35787.5"}, {"name": "EXPRESS-AM8", "norad": "40895", "lat": "0.011", "lon": "-14.0054", "alt_km": "35787.7"}, {"name": "EXPRESS-AM44", "norad": "33595", "lat": "3.3007", "lon": "-11.0363", "alt_km": "35771.1"}, {"name": "RADUGA-1M 3", "norad": "39375", "lat": "5.3139", "lon": "35.1309", "alt_km": "35792.4"}, {"name": "EXPRESS-AMU1", "norad": "41191", "lat": "0.03", "lon": "36.0995", "alt_km": "35782.0"}, {"name": "EXPRESS-AM7", "norad": "40505", "lat": "0.0151", "lon": "40.0363", "alt_km": "35782.8"}, {"name": "YAMAL 601", "norad": "44307", "lat": "0.0258", "lon": "49.0291", "alt_km": "35785.5"}, {"name": "YAMAL 402", "norad": "39022", "lat": "1.0934", "lon": "54.9735", "alt_km": "35786.9"}, {"name": "EXPRESS-AT2", "norad": "39613", "lat": "0.0", "lon": "55.9873", "alt_km": "35786.8"}, {"name": "LUCH-5X (OLYMP-K 2)", "norad": "55841", "lat": "0.029", "lon": "61.9716", "alt_km": "35783.2"}, {"name": "EXPRESS-AT1", "norad": "39612", "lat": "0.24", "lon": "67.4022", "alt_km": "35772.6"}, {"name": "ELEKTRO-L 3", "norad": "44903", "lat": "0.1788", "lon": "76.0049", "alt_km": "35790.6"}, {"name": "ELEKTRO-L 5", "norad": "67756", "lat": "-0.1938", "lon": "76.1208", "alt_km": "35785.4"}, {"name": "EXPRESS 80", "norad": "45986", "lat": "0.0001", "lon": "80.03", "alt_km": "35789.0"}, {"name": "YAMAL 401", "norad": "40345", "lat": "0.0006", "lon": "89.9527", "alt_km": "35789.7"}, {"name": "LUCH-5V", "norad": "39727", "lat": "-0.1219", "lon": "94.7674", "alt_km": "35788.5"}, {"name": "EXPRESS 103", "norad": "45985", "lat": "-0.0025", "lon": "96.4955", "alt_km": "35788.0"}, {"name": "EXPRESS AMU-3", "norad": "50002", "lat": "-0.0203", "lon": "102.8919", "alt_km": "35786.5"}, {"name": "EXPRESS-AM5", "norad": "39487", "lat": "-0.0082", "lon": "140.0262", "alt_km": "35788.0"}, {"name": "EXPRESS AMU-7", "norad": "50001", "lat": "-0.011", "lon": "145.0002", "alt_km": "35785.9"}, {"name": "YAMAL 202", "norad": "28089", "lat": "-6.0309", "lon": "163.3913", "alt_km": "35800.3"}, {"name": "ELEKTRO-L 4", "norad": "55506", "lat": "0.0363", "lon": "165.7709", "alt_km": "35791.7"}, {"name": "LUCH-5A", "norad": "37951", "lat": "-8.323", "lon": "166.8477", "alt_km": "35799.1"}];
const map = L.map("map").setView([0,140],2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:6, attribution:"OpenStreetMap"}).addTo(map);

function catOf(r) {
    const n = String(r.name || "").toUpperCase();

    if (n.includes("LUCH"))
        return [
            "#2b6cb0",
            "データ中継",
            "ISS・低軌道衛星・宇宙機との通信中継系"
        ];

    if (
        n.includes("EXPRESS") ||
        n.includes("EKSPRESS") ||
        n.includes("YAMAL")
    )
        return [
            "#3182ce",
            "通信",
            "ロシア系の静止通信衛星"
        ];

    if (n.includes("ELEKTRO"))
        return [
            "#2f855a",
            "気象・観測",
            "静止気象・地球観測系"
        ];

    if (
        n.includes("RADUGA") ||
        n.includes("GARPUN")
    )
        return [
            "#c53030",
            "軍事通信",
            "軍事通信・政府通信系の可能性"
        ];

    return [
        "#718096",
        "未整理",
        "用途未整理。公開情報または自分メモで追記"
    ];
}


function popOf(r) {

    const c = catOf(r);

    return (
        "<b>" + r.name + "</b><br>" +

        "<span style='" +
        "display:inline-block;" +
        "margin:4px 0;" +
        "padding:2px 8px;" +
        "border-radius:10px;" +
        "background:" + c[0] + ";" +
        "color:white;" +
        "font-size:12px;" +
        "'>" +

        c[1] +

        "</span><br>" +

        "<b>NORAD ID：</b>" +
        r.norad + "<br>" +

        "<b>緯度：</b>" +
        r.lat + "°<br>" +

        "<b>経度：</b>" +
        r.lon + "°<br>" +

        "<b>高度：</b>" +
        r.alt_km + " km<br>" +

        "<hr>" +

        "<b>国：</b>ロシア<br>" +

        "<b>分類：</b>" +
        c[1] + "<br>" +

        "<b>任務メモ：</b>" +
        c[2]
    );
}


data.forEach(r => {

    const c = catOf(r);

    L.circleMarker(
        [
            parseFloat(r.lat),
            parseFloat(r.lon)
        ],
        {
            radius: 8,
            color: "#1a202c",
            weight: 1,
            fillColor: c[0],
            fillOpacity: 0.9
        }
    )
    .addTo(map)
    .bindPopup(popOf(r));
});


const legend =
    L.control({
        position: "bottomleft"
    });


legend.onAdd = function() {

    const div =
        L.DomUtil.create(
            "div",
            "info legend"
        );

    div.style.background = "white";
    div.style.padding = "10px";
    div.style.borderRadius = "8px";
    div.style.boxShadow =
        "0 1px 5px rgba(0,0,0,0.3)";
    div.style.fontSize = "13px";

    div.innerHTML =
        "<b>衛星カテゴリ</b><br>" +
        "<div>🔵 データ中継</div>" +
        "<div>🔷 通信</div>" +
        "<div>🔴 軍事通信</div>" +
        "<div>🟢 気象・観測</div>" +
        "<div>⚫ 未整理</div>";

    return div;
};


legend.addTo(map);

</script></body></html>
