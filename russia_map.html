<html><head><meta charset="utf-8"><title>Russia GEO Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:sans-serif}.bar{padding:12px;background:#f7f3ea}.btn{display:block;background:#1f6f5b;color:white;text-align:center;text-decoration:none;padding:12px;margin-top:8px;border-radius:8px;font-size:18px}#map{height:78vh;width:100vw}</style></head><body>
<div class="bar"><b>Russia GEO Map</b><br>CelesTrak GEO TLEから抽出したRussia GEOの地図表示<a class="btn" href="/cgi-bin/update.py">最新TLEで更新</a></div>
<div id="map"></div>
<script>
const data = [];
const map = L.map("map").setView([0,140],2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 6, attribution: "OpenStreetMap"}).addTo(map);
function catOf(r){const n=String(r.name||"").toUpperCase();if(n.includes("LUCH"))return ["#2b6cb0","データ中継","ISS・低軌道衛星・宇宙機との通信中継系"];if(n.includes("EXPRESS")||n.includes("EKSPRESS")||n.includes("YAMAL"))return ["#3182ce","通信","ロシア系の静止通信衛星"];if(n.includes("ELEKTRO"))return ["#2f855a","気象・観測","静止気象・地球観測系"];if(n.includes("RADUGA")||n.includes("GARPUN"))return ["#c53030","軍事通信","軍事通信・政府通信系の可能性"];return ["#718096","未整理","用途未整理。公開情報または自分メモで追記"];}function popOf(r){const c=catOf(r);return "<b>"+r.name+"</b><br><span style='display:inline-block;margin:4px 0;padding:2px 8px;border-radius:10px;background:"+c[0]+";color:white;font-size:12px;'>"+c[1]+"</span><br>NORAD "+r.norad+"<br>Lat "+r.lat+"<br>Lon "+r.lon+"<br>Alt km "+r.alt_km+"<br><hr><b>国:</b> ロシア<br><b>分類:</b> "+c[1]+"<br><b>任務メモ:</b> "+c[2];}data.forEach(r=>{const c=catOf(r);L.circleMarker([parseFloat(r.lat),parseFloat(r.lon)],{radius:8,color:"#1a202c",weight:1,fillColor:c[0],fillOpacity:0.9}).addTo(map).bindPopup(popOf(r));});const legend=L.control({position:"bottomleft"});legend.onAdd=function(){const div=L.DomUtil.create("div","info legend");div.style.background="white";div.style.padding="10px";div.style.borderRadius="8px";div.style.boxShadow="0 1px 5px rgba(0,0,0,0.3)";div.style.fontSize="13px";div.innerHTML="<b>衛星カテゴリ</b><br><div>🔵 データ中継</div><div>🔷 通信</div><div>🔴 軍事通信</div><div>🟢 気象・観測</div><div>⚫ 未整理</div>";return div;};legend.addTo(map);
</script></body></html>
