function catOf(r) {

    const n = String(r.name || "").toUpperCase();

    if (n.includes("LUCH"))
        return [
            "#2b6cb0",
            "データ中継",
            "ISS・低軌道衛星・宇宙機との通信中継系"
        ];

    if (
        n.includes("EXPRESS") ||
        n.includes("EKSPRESS") ||
        n.includes("YAMAL")
    )
        return [
            "#3182ce",
            "通信",
            "ロシア系の静止通信衛星"
        ];

    if (n.includes("ELEKTRO"))
        return [
            "#2f855a",
            "気象・観測",
            "静止気象・地球観測系"
        ];

    if (
        n.includes("RADUGA") ||
        n.includes("GARPUN")
    )
        return [
            "#c53030",
            "軍事通信",
            "軍事通信・政府通信系の可能性"
        ];

    return [
        "#718096",
        "未整理",
        "用途未整理。公開情報または自分メモで追記"
    ];
}


function ageOf(epochIso) {

    const epoch = new Date(epochIso);

    if (Number.isNaN(epoch.getTime())) {
        return "不明";
    }

    let diff = Date.now() - epoch.getTime();
    const future = diff < 0;

    diff = Math.abs(diff);

    const totalMinutes =
        Math.floor(diff / 60000);

    const days =
        Math.floor(totalMinutes / 1440);

    const hours =
        Math.floor((totalMinutes % 1440) / 60);

    const minutes =
        totalMinutes % 60;

    let text = "";

    if (days > 0) {
        text += days + "日 ";
    }

    text += hours + "時間" + minutes + "分";

    return future ? "未来 " + text : text;
}


function freshnessOf(epochIso) {

    const epoch = new Date(epochIso);

    if (Number.isNaN(epoch.getTime())) {
        return {
            color: "#718096",
            icon: "⚪",
            text: "不明"
        };
    }

    const ageHours =
        (Date.now() - epoch.getTime()) / 3600000;

    if (ageHours < 24) {
        return {
            color: "#16a34a",
            icon: "🟢",
            text: "新鮮"
        };
    }

    if (ageHours < 72) {
        return {
            color: "#ca8a04",
            icon: "🟡",
            text: "やや古い"
        };
    }

    if (ageHours < 168) {
        return {
            color: "#ea580c",
            icon: "🟠",
            text: "古い"
        };
    }

    return {
        color: "#dc2626",
        icon: "🔴",
        text: "要注意"
    };
}


function popOf(r) {

    const c = catOf(r);
    const fresh = freshnessOf(r.epoch_iso);

    return (
        "<b>" + r.name + "</b><br>" +

        "<span style='" +
        "display:inline-block;" +
        "margin:4px 0;" +
        "padding:2px 8px;" +
        "border-radius:10px;" +
        "background:" + c[0] + ";" +
        "color:white;" +
        "font-size:12px;" +
        "'>" +
        c[1] +
        "</span><br>" +

        "<b>NORAD ID：</b>" +
        r.norad + "<br>" +

        "<b>緯度：</b>" +
        r.lat + "°<br>" +

        "<b>経度：</b>" +
        r.lon + "°<br>" +

        "<b>高度：</b>" +
        r.alt_km + " km<br>" +

        "<hr>" +

        "<b>TLEエポック：</b>" +
        r.epoch_day + "<br>" +

        "<b>エポック日時：</b>" +
        r.epoch_utc + "<br>" +

        "<b>経過時間：</b>" +
        ageOf(r.epoch_iso) + "<br>" +

        "<b>TLE鮮度：</b>" +
        "<span style='" +
        "font-weight:bold;" +
        "color:" + fresh.color + ";" +
        "'>" +
        fresh.icon + " " +
        fresh.text +
        "</span><br>" +

        "<hr>" +

        "<b>国：</b>ロシア<br>" +

        "<b>分類：</b>" +
        c[1] + "<br>" +

        "<b>任務メモ：</b>" +
        c[2]
    );
}

        }

    .addTo(map)
    .bindPopup(popOf(r));
});
