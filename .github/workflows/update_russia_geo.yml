name: Update Russia GEO data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-russia-geo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield

      - name: Download latest GEO TLE from CelesTrak
        run: |
          curl -L "https://celestrak.org/NORAD/elements/gp.php?GROUP=geo&FORMAT=tle" -o geo.tle

      - name: Generate Russia GEO CSV and map
        run: |
          python make_russia_csv.py
          python make_russia_map.py

      - name: Commit updated Russia GEO files
        run: |
          TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M:%S JST' > last_updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geo.tle russia_clean.tle russia_geo.csv russia_map.html last_updated.txt
          git commit -m "Update Russia GEO data" || echo "No changes to commit"
          git push
